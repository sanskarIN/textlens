name: Rustfmt fix

on:
  pull_request:
    paths:
      - "src-tauri/**/*.rs"
      - ".github/workflows/rustfmt-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/cross-platform-native-smoke
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add src-tauri
          git commit -m "style: apply rustfmt output"
          git push origin HEAD:ci/cross-platform-native-smoke
