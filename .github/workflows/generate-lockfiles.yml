name: Generate lockfiles

on:
  push:
    branches:
      - docs/update-project-handoff
    paths:
      - .github/workflows/generate-lockfiles.yml
      - package.json
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit generated lockfiles
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock && \
             git diff --cached --quiet -- package-lock.json src-tauri/Cargo.lock; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "build: generate dependency lockfiles"
          git push
