name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web:
    name: Build Web/PWA
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag
        run: npm run release:tag-check

      - name: Verify version metadata and release documentation
        run: npm run version:check

      - run: npm ci --no-audit --no-fund
      - run: npm run build:web

      - name: Upload Web/PWA artifact
        uses: actions/upload-artifact@v7
        with:
          name: textlens-${{ github.ref_name }}-web-pwa
          path: dist/
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag
        run: npm run release:tag-check

      - name: Verify version metadata and release documentation
        run: npm run version:check

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify committed Cargo lockfile
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TextLens ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md and docs/releases/${{ github.ref_name }}.md for release notes and verification status."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
