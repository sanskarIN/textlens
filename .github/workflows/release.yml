name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release tag
        run: npm run release:tag-check

      - name: Verify version metadata and release documentation
        run: npm run version:check

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Cargo lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TextLens ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md and docs/releases/${{ github.ref_name }}.md for release notes and verification status."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
