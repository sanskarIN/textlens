name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag
        run: npm run release:tag-check

      - name: Verify version metadata and release documentation
        run: npm run version:check

      - name: Verify reproducible dependency locks
        run: npm run release:readiness

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify Cargo lockfile matches manifests
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TextLens ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md and docs/releases/${{ github.ref_name }}.md for release notes and verification status."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Capture release build evidence
        if: always()
        env:
          TEXTLENS_BUILD_STATUS: ${{ job.status }}
        run: node scripts/write-build-evidence.mjs release-evidence/${{ matrix.platform }}.json

      - name: Upload release build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.platform }}
          path: release-evidence/${{ matrix.platform }}.json
          if-no-files-found: error
