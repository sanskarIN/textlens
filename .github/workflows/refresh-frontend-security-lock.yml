name: Refresh frontend security lock

on:
  push:
    branches:
      - ci/cross-platform-native-smoke
    paths:
      - .github/workflows/refresh-frontend-security-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-frontend-security-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate and verify npm security lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked frontend graph
        run: |
          npm ci --no-audit --no-fund
          npm run version:check
          npm run check
          npm run lint
          npm run format:check
          npm run docs:check
          npm run test
          npm run build
          npm audit --audit-level=high
      - name: Commit generated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "build: refresh lockfile for security updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
