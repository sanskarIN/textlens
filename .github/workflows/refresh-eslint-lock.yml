name: Refresh ESLint lockfile

on:
  push:
    branches:
      - ci/cross-platform-native-smoke
    paths:
      - .github/workflows/refresh-eslint-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-eslint-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate and verify npm lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked frontend graph
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run lint
          npm run test
          npm run build
      - name: Commit generated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "build: refresh npm lockfile for ESLint"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
