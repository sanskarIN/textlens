name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run version:check
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run test
      - run: npm run build
      - run: npm run build:web
      - run: npm run build:mobile

  rust:
    name: Rust quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets

  lockfiles:
    name: Generate reproducibility lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: textlens-reproducibility-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
