name: Release Candidate Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version metadata and release documentation
        run: npm run version:check

      - name: Verify reproducible dependency locks
        run: npm run release:readiness

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify Cargo lockfile matches manifests
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation links
        run: npm run docs:check

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets

      - name: Record release benchmark
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: |
          mkdir -p ../release-evidence
          cargo run --locked --release --example benchmark -- 16 5 | tee ../release-evidence/benchmark-ubuntu-22.04.txt

      - name: Build native bundle
        run: npm run tauri:build

      - name: Capture release-candidate evidence
        if: always()
        env:
          TEXTLENS_BUILD_STATUS: ${{ job.status }}
        run: node scripts/write-build-evidence.mjs release-evidence/${{ matrix.platform }}.json

      - name: Upload release-candidate evidence and bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.platform }}
          path: |
            release-evidence/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
