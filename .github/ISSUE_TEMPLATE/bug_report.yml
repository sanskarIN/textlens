name: Bug report
description: Report a reproducible TextLens defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TextLens. Use synthetic text only; never upload a private document or credentials.
  - type: input
    id: version
    attributes:
      label: TextLens version
      placeholder: "2.0.12 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Synthetic sample text
      description: Optional. Do not paste confidential or personal content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed private data, credentials, and confidential document contents.
          required: true
        - label: This is not a security vulnerability.
          required: true
