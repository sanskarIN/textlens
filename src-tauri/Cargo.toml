[package]
name = "textlens"
version = "0.1.0"
description = "Privacy-first desktop text analysis."
authors = ["Sanskar <sanskarin@outlook.in>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sanskarIN/textlens"
rust-version = "1.77.2"

[lib]
name = "textlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12"

[dev-dependencies]
proptest = "1.6"
tempfile = "3"
