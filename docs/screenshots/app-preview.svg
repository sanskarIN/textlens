<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">TextLens interface preview</title><desc id="d">A dark desktop interface with an editor, metric cards, keyword analysis, and diagnostics.</desc><rect width="1200" height="720" rx="28" fill="#0b0f17"/><rect x="38" y="28" width="1124" height="64" rx="18" fill="#121927" stroke="#29354b"/><circle cx="78" cy="60" r="18" fill="#7c5cff"/><text x="110" y="57" fill="#f7f9fc" font-family="Arial" font-size="20" font-weight="700">TextLens</text><text x="110" y="75" fill="#a8b2c6" font-family="Arial" font-size="11">Private, precise text analysis</text><rect x="38" y="116" width="1124" height="250" rx="20" fill="#121927" stroke="#29354b"/><text x="62" y="151" fill="#8b73ff" font-family="Arial" font-size="12" font-weight="700">WORKSPACE</text><rect x="62" y="170" width="1076" height="160" rx="14" fill="#0f1520" stroke="#29354b"/><text x="84" y="205" fill="#a8b2c6" font-family="monospace" font-size="16">Paste or type text here, or open a text file…</text><g fill="#121927" stroke="#29354b"><rect x="38" y="390" width="265" height="110" rx="18"/><rect x="325" y="390" width="265" height="110" rx="18"/><rect x="612" y="390" width="265" height="110" rx="18"/><rect x="899" y="390" width="263" height="110" rx="18"/></g><g font-family="Arial"><text x="62" y="423" fill="#a8b2c6" font-size="13">Words</text><text x="62" y="466" fill="#f7f9fc" font-size="31" font-weight="700">1,248</text><text x="349" y="423" fill="#a8b2c6" font-size="13">Characters</text><text x="349" y="466" fill="#f7f9fc" font-size="31" font-weight="700">7,904</text><text x="636" y="423" fill="#a8b2c6" font-size="13">Reading time</text><text x="636" y="466" fill="#f7f9fc" font-size="31" font-weight="700">6 min</text><text x="923" y="423" fill="#a8b2c6" font-size="13">Lines</text><text x="923" y="466" fill="#f7f9fc" font-size="31" font-weight="700">84</text></g><rect x="38" y="524" width="550" height="158" rx="20" fill="#121927" stroke="#29354b"/><rect x="612" y="524" width="550" height="158" rx="20" fill="#121927" stroke="#29354b"/><text x="62" y="559" fill="#8b73ff" font-family="Arial" font-size="12" font-weight="700">KEYWORDS</text><text x="636" y="559" fill="#8b73ff" font-family="Arial" font-size="12" font-weight="700">DIAGNOSTICS</text><g fill="#a8b2c6" font-family="Arial" font-size="14"><text x="62" y="594">analysis · 18</text><text x="62" y="625">text · 14</text><text x="62" y="656">privacy · 9</text><text x="636" y="594">Line endings  LF</text><text x="636" y="625">Trailing whitespace  2 lines</text><text x="636" y="656">Encoding  UTF-8</text></g></svg>
